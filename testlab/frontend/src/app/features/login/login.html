<h1>Login</h1>
<form [formGroup]="form" (ngSubmit)="onSubmit()" class="border rounded p-4">
  <div class="mb-3">
    <label>Email</label>
    <input type="email" formControlName="email" class="form-control">
  </div>
  <div class="mb-3">
    <label>Password</label>
    <input type="password" formControlName="password" class="form-control">
  </div>
  <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Entrar</button>
  <div *ngIf="error" class="text-danger mt-2">{{ error }}</div>
</form>
