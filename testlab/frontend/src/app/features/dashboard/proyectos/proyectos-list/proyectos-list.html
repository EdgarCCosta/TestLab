<h1>Proyectos</h1>

<div class="table-responsive">
  <table class="table table-hover">
    <thead>
      <tr>
        <th scope="col">Proyecto</th>
        <th scope="col">Versión</th>
        <th scope="col">Estado</th>
      </tr>
    </thead>
    <tbody>
      @for (p of proyectos; track p) {
        <tr (click)="detalleProyecto(p.id)"> 
          <td>{{ p.nombre }}</td>
          <td>{{ p.descripcion }}</td>
          <td><span class="ok"><i class="bi bi-circle-fill"></i> OK</span></td>
        </tr>
      }
    </tbody>
  </table>
</div>
