
<h1>Estadísticas</h1>
<p>Métricas de Testlab</p>


<!-- Sección tabs con listados -->
<section>

  <!-- Pestañas -->
  <nav class="mt-5">
    <div class="nav nav-pills" id="nav-tab" role="tablist">
      <div class="menu-pildoras d-flex p-2">

        <button class="nav-link fs-4 text-dark active mx-1" id="nav-general-tab" data-bs-toggle="tab" data-bs-target="#nav-general" type="button" role="tab" aria-controls="nav-general" aria-selected="true">
        <i class="bi bi-person-circle"></i> Generales
        </button>

        <button class="nav-link text-dark fs-4 mx-1" id="nav-proyecto-tab" data-bs-toggle="tab" data-bs-target="#nav-proyecto" type="button" role="tab" aria-controls="nav-proyecto" aria-selected="false">
          <i class="bi bi-box-seam"></i> Por proyecto
        </button>

        <button class="nav-link text-dark fs-4 mx-1" id="nav-usuario-tab" data-bs-toggle="tab" data-bs-target="#nav-usuario" type="button" role="tab" aria-controls="nav-usuario" aria-selected="false">
          <i class="bi bi-clipboard2-check"></i> Por usuario
        </button>

      </div>
    </div>
  </nav>

  <!-- Contenidos de pestañas en Grid -->

  <div class="tab-content pt-4" id="nav-tabContent">

    <!-- ESTADISTICAS GENERALES -->
    <div class="stats tab-pane fade show active" id="nav-general" role="tabpanel" aria-labelledby="nav-general-tab" tabindex="0">

      <!-- Fila superior -->
      <div class="row">
        <div class="col">
          <div class="card shadow-sm">
            <div class="stat-title">
              Tests totales
            </div>
            <div class="stat-number">
              128
            </div>
            <div class="stat-comment stat-success">
              <i class="bi bi-caret-up-fill"></i>12% frente al mes anterior
            </div>
          </div>
        </div>
        <div class="col">
          <div class="card shadow-sm">
            <div class="stat-title">
              Tests pasados
            </div>
            <div class="stat-number stat-success">
              240
            </div>
            <div class="stat-comment">
              75% de éxito
            </div>
          </div>
        </div>
        <div class="col">
          <div class="card shadow-sm">
            <div class="stat-title">
              Tests fallidos
            </div>
            <div class="stat-number stat-fail">
              42
            </div>
            <div class="stat-comment">
              25% de fallos
            </div>
          </div>
        </div>
        <div class="col">
          <div class="card shadow-sm">
            <div class="stat-title">
              Tests pendientes
            </div>
            <div class="stat-number">
              33
            </div>
            <div class="stat-comment">
              15% pendientes
            </div>
          </div>
        </div>
      </div>

      <!-- Fila inferior -->
      <div class="row">
        <div class="col chart">
          <div class="card shadow-sm p-3">
            Evolución mensual
            <div>
              <canvas id="GraficoEvolucion"></canvas>
            </div>
          </div>
        </div>
        <div class="col chart">
          <div class="card shadow-sm p-3">
            Distribución de estados
            <div>
              <canvas id="GraficoEstados"></canvas>
            </div>
          </div>
        </div>
      </div>
      

    </div>

    <!-- ESTADISTICAS POR PROYECTO -->
    <div class="tab-pane fade" id="nav-proyecto" role="tabpanel" aria-labelledby="nav-proyecto-tab" tabindex="1">


      <div class="card shadow-sm">
          Comparativa por proyecto
      </div>


    </div>

    <!-- ESTADISTICAS POR USUARIO -->
    <div class="tab-pane fade" id="nav-usuario" role="tabpanel" aria-labelledby="nav-usuario-tab" tabindex="2">

      <div class="card shadow-sm">
        Productividad por usuario
      </div>

    </div>

  </div>
  
</section>
