<h1>Usuarios</h1>

<div class="table-responsive">
  <table class="table table-hover">
    <thead>
      <tr>
        <th scope="col">Nombre</th>
        <th scope="col">Email</th>
        <th scope="col">Rol</th>
        <th scope="col">Actualizado</th>
      </tr>
    </thead>
    <tbody class="table-group-divider">
      @for (u of usuarios; track u) {
        <tr (click)="this.seleccionarUsuario(u.id)" data-bs-toggle="modal" data-bs-target="#detalleModal">
          <td>{{ u.nombre }}</td>
          <td>{{ u.email }}</td>
          <td>
            <span class="badge bg-primary">{{ u.rol }}</span>
          </td>
          <td>{{ u.updated_at | date:'short' }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>

  <!-- Modal -->
  <div class="modal fade modal-lg" id="detalleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content p-5">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="exampleModalLabel">Detalle usuario</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          
            <app-usuario-detail [usuarioId]="this.usuarioSelId"></app-usuario-detail>
          
        </div>
        <!-- <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          <button type="button" class="btn btn-primary">Guardar cambios</button>
        </div> -->
      </div>
    </div>
  </div>
