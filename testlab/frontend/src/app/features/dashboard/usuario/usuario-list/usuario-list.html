<h1>Usuarios</h1>

<div class="table-responsive">
  <table class="table table-hover">
    <thead>
      <tr>
        <th scope="col">Nombre</th>
        <th scope="col">Email</th>
        <th scope="col">Rol</th>
        <th scope="col">Actualizado</th>
      </tr>
    </thead>
    <tbody class="table-group-divider">
      @for (u of usuarios; track u) {
        <tr (click)="this.seleccionarUsuario(u.id)" data-bs-toggle="modal" data-bs-target="#detalleModal">
          <td>{{ u.nombre }}</td>
          <td>{{ u.email }}</td>
          <td>
            <span class="badge bg-primary">{{ u.rol }}</span>
          </td>
          <td>{{ u.updated_at | date:'short' }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
<app-modal>
  <app-usuario-detail [usuarioId]="this.usuarioSelId"></app-usuario-detail>
</app-modal>
