<input id="filtro" type="text" name="filtro" [(ngModel)]="filtro" placeholder="Buscar usuario" class="filtro rounded-3 ps-4 py-2">


<div class="d-flex justify-content-between mb-5">
  <h1>Usuarios</h1>
  <button type="button" class="btn btn-nuevo"><i class="bi bi-plus-lg"></i> Nuevo usuario</button>
</div>

<app-listado [(itemSelId)]="this.usuarioSelId"
  [cabeceras]="['Nombre', 'Email', 'Rol', 'Actualizado']" 
  [datos]="this.usuariosFiltrados"
  [atributos]="['nombre', 'email', 'rol','updated_at']">
</app-listado>

<app-modal>
  <app-usuario-detail [usuarioId]="this.usuarioSelId"></app-usuario-detail>
</app-modal>
