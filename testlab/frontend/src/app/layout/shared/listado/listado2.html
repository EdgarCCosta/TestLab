<table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z2 w-100">

  <!-- Columnas dinámicas -->
  @for (col of cabeceras(); track col) {

    <ng-container [matColumnDef]="col">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>
        {{ col }}
      </th>

      <td mat-cell *matCellDef="let item">

        @if (col === 'Estado') {

          @if (item.status === 'active') {
            <span class="text-success fw-semibold">
              <i class="bi bi-circle-fill text-success"></i> Activo
            </span>
          }

          @else if (item.status === 'inactive') {
            <span class="text-danger fw-semibold">
              <i class="bi bi-circle-fill text-danger"></i> Inactivo
            </span>
          }

          @else if (item.status === 'archived') {
            <span class="text-warning fw-semibold">
              <i class="bi bi-circle-fill text-warning"></i> Archivado
            </span>
          }

        } @else {
          {{ item[col] }}
        }

      </td>
    </ng-container>

  }

  <!-- Header -->
  <tr mat-header-row *matHeaderRowDef="cabeceras()"></tr>

  <!-- Filas -->
  <tr mat-row
      *matRowDef="let row; columns: cabeceras()"
      (click)="seleccionarItem(row.id)"
      [attr.data-bs-toggle]="abrirModal() ? 'modal' : null"
      [attr.data-bs-target]="abrirModal() ? '#detalleModal' : null">
  </tr>

</table>

<!-- PAGINADOR -->
<mat-paginator
  [pageSize]="10"
  [pageSizeOptions]="[5, 10, 20]"
  showFirstLastButtons>
</mat-paginator>
