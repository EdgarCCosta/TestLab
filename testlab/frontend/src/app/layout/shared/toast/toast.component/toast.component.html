<div class="toast-container position-fixed start-50 translate-middle-x"
     style="bottom: 10%; z-index: 2000; width: 100%; display: flex; justify-content: center;">
  
  @for (t of toastService.toasts(); track t) {
    <div class="mb-3 p-3 rounded shadow-lg"
         [class.toast-success]="t.type === 'success'"
         [class.toast-error]="t.type === 'error'">
      {{ t.text }}
    </div>
  }

</div>
